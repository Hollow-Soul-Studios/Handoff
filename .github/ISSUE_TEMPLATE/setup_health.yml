name: Setup health check problem
description: A health check shows Warning or Fail and you cannot fix it, or the check looks wrong.
title: "[Setup]: "
labels: ["setup", "needs-bundle"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Handoff for UMG
        - Handoff for Slate
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        See the health check reference for what each check means and the usual fix: [Handoff for UMG](https://github.com/Hollow-Soul-Studios/Handoff/blob/main/docs/umg/support/health-checks.md), [Handoff for Slate](https://github.com/Hollow-Soul-Studios/Handoff/blob/main/docs/slate/support/health-checks.md).
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: engine_version
    attributes:
      label: Engine version
      options:
        - "5.8"
        - "5.7"
        - Other
    validations:
      required: true
  - type: dropdown
    id: check
    attributes:
      label: Which check?
      options:
        - "UMG HC01 Plugin modules"
        - "UMG HC02 Engine version"
        - "UMG HC03 CommonUI"
        - "UMG HC04 Enhanced Input support (CommonUI)"
        - "UMG HC05 Input action folder"
        - "UMG HC06 Default destination"
        - "UMG HC07 Font mappings"
        - "UMG HC08 Font search folders"
        - "UMG HC09 Import manifests"
        - "UMG HC10 Write access"
        - "UMG HC11 Backups"
        - "UMG HC12 Source control"
        - "UMG HC13 Python Editor Script Plugin"
        - "UMG HC14 Figma REST token"
        - "UMG HC15 Rendering (preview / -Render)"
        - "UMG HC16 Handoff errors this session"
        - "Slate HC01 Plugin and engine version"
        - "Slate HC02 Destination folder"
        - "Slate HC03 Module dependencies"
        - "Slate HC04 Resources folder"
        - "Slate HC05 Resources staged for packaging"
        - "Slate HC06 Import manifests"
        - "Slate HC07 Baselines"
        - "Slate HC08 Edited generated files"
        - "Slate HC09 User stubs"
        - "Slate HC10 Font mappings"
        - "Slate HC11 Font search folders"
        - "Slate HC12 Backups"
        - "Slate HC13 Source control"
        - "Slate HC14 Python Editor Script Plugin"
        - "Slate HC15 Figma REST token"
        - "Slate HC16 IDE project files"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status shown
      options:
        - Warning
        - Fail
        - Pass or Info, but it should not be
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the output of the check (Check Setup window, `Handoff.Health` / `SlateHandoff.Health`, or `-run=HandoffImport -Health` / `-run=SlateHandoffImport -Health`). Do not include your Figma token.
      render: text
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try?
      description: The fix suggested by the check, and what happened.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Support bundle zip.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and read the health check reference.
          required: true
        - label: I attached the support bundle or explained why not.
          required: true
