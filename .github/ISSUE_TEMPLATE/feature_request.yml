name: Feature request
description: Suggest an improvement. Check the roadmap first.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Handoff for UMG
        - Handoff for Slate
        - Figma exporter
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/Hollow-Soul-Studios/Handoff-for-UMG/blob/main/ROADMAP.md) and the existing issues first. Non-goals: runtime module, gameplay logic, full round trip back to Figma; Handoff for Slate does not produce Widget Blueprints and Handoff for UMG does not produce C++.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / layout
        - Plan / diff window
        - Generated code (Slate)
        - Re-import / merge / re-link
        - Fonts and styles
        - Resources / packaging (Slate)
        - CommonUI (UMG)
        - Preview / render
        - REST fetch
        - Python / commandlet / CI
        - Figma exporter
        - Other design tool exporter
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and the roadmap.
          required: true
